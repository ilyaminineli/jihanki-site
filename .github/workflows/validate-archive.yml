name: Validate JIHANKI archive

on:
  push:
    paths:
      - "data/**"
      - "js/categories.js"
      - "js/**"
      - "css/**"
      - "index.html"
      - "sw.js"
      - "projects/aokigahara/**"
      - "scripts/**"
      - ".github/workflows/validate-archive.yml"
  pull_request:
    paths:
      - "data/**"
      - "js/categories.js"
      - "js/**"
      - "css/**"
      - "index.html"
      - "sw.js"
      - "projects/aokigahara/**"
      - "scripts/**"
      - ".github/workflows/validate-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Archive and reference integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for source in js/*.js sw.js scripts/*.mjs; do
            node --check "$source"
          done
      - name: Validate media manifest
        run: node scripts/build-media-manifest.mjs --check
      - name: Test archive schema fixtures
        run: node scripts/test-archive-schema.mjs
      - name: Test relationship semantics and place corrections
        run: node scripts/test-relationship-semantics.mjs
      - name: Test field impressions
        run: node scripts/test-field-impressions.mjs
      - name: Test curated memory traces
        run: node scripts/test-memory-traces.mjs
      - name: Test curator cabinet cards
        run: node scripts/test-curators-cabinet.mjs
      - name: Test listening room
        run: node scripts/test-listening-room.mjs
      - name: Test quiet signals
        run: node scripts/test-quiet-signals.mjs
      - name: Test machine interaction transitions
        run: node scripts/test-interaction-model.mjs
      - name: Test Markdown link validation fixtures
        run: node scripts/test-markdown-links.mjs
      - name: Test media manifest integrity fixtures
        run: node scripts/test-media-manifest.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test responsive layouts and offline recovery
        run: node scripts/test-responsive.mjs
      - name: Upload map viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jihanki-device-emulation
          path: test-results/*.png
          if-no-files-found: ignore
      - name: Validate archive, relationships and local assets
        run: node scripts/validate-archive.mjs
