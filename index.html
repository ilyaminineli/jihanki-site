<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <script>
        /* Apply the 429 x 932 machine scale before the first mobile paint. */
        (function () {
            try {
                const root = document.documentElement;
                const width = Math.max(1, root.clientWidth || window.innerWidth || 429);
                const height = Math.max(1, window.innerHeight || 932);
                const widthScale = Math.min(width / 429, 1);
                const shortLandscape = width > height && height < 620;
                const scrollable = (width <= 560 || shortLandscape) && (932 * widthScale + 24 > height);
                const scale = scrollable ? widthScale : Math.min(widthScale, height / 932, 1);
                root.style.setProperty("--scale", String(scale));
                root.classList.toggle("machine-scroll", scrollable);
            } catch (_) { /* The controller applies the same sizing after startup. */ }
        })();
    </script>

    <title>自販機 — JIHANKI</title>

    <style>
        /* =========================================================
   JIHANKI
   Master coordinate system: 429 × 932
   This is the Figma/iPhone Pro Max composition.

   IMPORTANT:
   The PNG itself starts at:
       x = 0
       y = 73
       width = 429
       height = 786

   ALL interactive coordinates below remain VIEWPORT
   coordinates, exactly as in Figma.
========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #171717;
            font-family: "Courier New", monospace;
        }

        button {
            font: inherit;
        }

        #viewport {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 429px;
            height: 932px;

            transform:
                translate(-50%, -50%) scale(var(--scale, 1));

            transform-origin: center center;
        }

        /* =========================================================
   MACHINE IMAGE
========================================================= */

        #jihanki {
            position: absolute;
            left: 0;
            top: 73px;
            width: 429px;
            height: 786px;
            z-index: 1;
        }

        #machine-image {
            display: block;
            width: 429px;
            height: 786px;
            user-select: none;
            pointer-events: none;
        }

        /* =========================================================
   SCREEN
   EXACT FIGMA COORDINATES
========================================================= */

        #screen {
            position: absolute;

            left: 98px;
            top: 151px;
            width: 238px;
            height: 177px;

            overflow: hidden;

            background: rgba(0, 0, 0, .30);

            border: 1px solid rgba(255, 255, 255, .08);

            box-shadow:
                inset 0 0 30px rgba(0, 0, 0, .82),
                0 0 10px rgba(0, 0, 0, .60);

            z-index: 20;
        }

        #screen::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 30;

            background:
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 2px,
                    rgba(255, 255, 255, .035) 3px);
        }

        #screen::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 31;

            background:
                linear-gradient(110deg,
                    rgba(255, 255, 255, .035),
                    transparent 35%);
        }

        #screen-content {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 20;
            overflow: hidden;
            color: rgba(220, 220, 220, .84);
        }

        /* =========================================================
   START SCREEN
========================================================= */

        .boot {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            animation: boot-flicker 5s infinite;
        }

        .boot-japanese {
            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            font-size: 27px;
            letter-spacing: .28em;
            margin-left: .28em;

            text-shadow: 0 0 7px rgba(220, 220, 220, .18);
        }

        .boot-title {
            margin-top: 4px;
            font-size: 16px;
            letter-spacing: .30em;
            margin-left: .30em;
        }

        .boot-subtitle {
            margin-top: 5px;
            font-size: 7px;
            letter-spacing: .28em;
            margin-left: .28em;
            opacity: .42;
        }

        .boot-loading {
            margin-top: 25px;
            font-size: 7px;
            letter-spacing: .15em;
            opacity: .3;
            animation: loading-blink 1.6s infinite;
        }

        @keyframes boot-flicker {

            0%,
            90%,
            100% {
                opacity: 1;
            }

            91% {
                opacity: .72;
            }

            92% {
                opacity: 1;
            }

            95% {
                opacity: .88;
            }
        }

        @keyframes loading-blink {

            0%,
            40% {
                opacity: .12;
            }

            50% {
                opacity: .55;
            }

            60%,
            100% {
                opacity: .25;
            }
        }

        /* =========================================================
   PRODUCTS
   EXACT FIGMA COORDINATES
========================================================= */

        #products {
            position: absolute;
            inset: 0;
            width: 429px;
            height: 932px;
            z-index: 50;
            pointer-events: none;
        }

        .product {
            position: absolute;

            width: 62px;
            height: 85px;

            padding: 0;

            border: 1px solid rgba(255, 255, 255, .13);

            /* More visible than the previous version, but still
       transparent enough for the physical machine to show. */
            background: rgba(3, 3, 3, .34);

            color: rgba(235, 235, 235, .82);

            font-family: "Courier New", monospace;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: .08em;

            cursor: pointer;
            pointer-events: auto;

            text-shadow: 0 0 5px rgba(255, 255, 255, .25);

            box-shadow:
                inset 0 0 13px rgba(0, 0, 0, .45),
                0 2px 5px rgba(0, 0, 0, .20);

            transition:
                background .15s ease,
                color .15s ease,
                box-shadow .15s ease,
                transform .08s ease;
        }

        .product::before {
            content: "";

            position: absolute;
            left: 7px;
            top: 50%;

            width: 5px;
            height: 5px;

            transform: translateY(-50%);

            border-radius: 50%;

            background: rgba(220, 220, 220, .38);

            box-shadow: 0 0 4px rgba(255, 255, 255, .12);
        }

        .product-label {
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            white-space: nowrap;
        }

        .product:hover,
        .product:focus-visible,
        .product:active {
            background: rgba(0, 0, 0, .55);
            color: #fff;

            box-shadow:
                inset 0 0 13px rgba(0, 0, 0, .55),
                0 0 8px rgba(255, 255, 255, .10);
        }

        .product:hover::before,
        .product:focus-visible::before {
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 0 7px rgba(255, 255, 255, .7);
        }

        .product:active {
            transform: scale(.95);
        }

        /* ROW 1 */
        #video {
            left: 36px;
            top: 373px;
        }

        #photo {
            left: 118px;
            top: 373px;
        }

        #note {
            left: 193px;
            top: 373px;
        }

        #yokai {
            left: 268px;
            top: 373px;
        }

        /* ROW 2 — your new Figma coordinates */
        #music {
            left: 42px;
            top: 528px;
        }

        #sound {
            left: 117px;
            top: 528px;
        }

        #text {
            left: 192px;
            top: 528px;
        }

        #other {
            left: 269px;
            top: 528px;
        }

        /* =========================================================
   SIDE CONTROLS
   EXACT FIGMA COORDINATES
========================================================= */

        #controls {
            position: absolute;
            inset: 0;
            width: 429px;
            height: 932px;
            z-index: 60;
            pointer-events: none;
        }

        .machine-control {
            position: absolute;

            padding: 0;

            border: 1px solid rgba(255, 255, 255, .12);

            background: rgba(3, 3, 3, .34);

            color: rgba(235, 235, 235, .75);

            font-family: "Courier New", monospace;
            font-size: 7px;
            letter-spacing: .08em;

            cursor: pointer;
            pointer-events: auto;

            text-shadow: 0 0 5px rgba(255, 255, 255, .18);

            transition:
                background .15s,
                color .15s,
                transform .08s;
        }

        .machine-control:hover,
        .machine-control:focus-visible {
            background: rgba(0, 0, 0, .52);
            color: #fff;
        }

        .machine-control:active {
            transform: scale(.94);
        }

        /* Coin */
        #coin-button {
            left: 357px;
            top: 434px;
            width: 49px;
            height: 38px;
        }

        /* Home */
        #home-button {
            left: 357px;
            top: 657px;
            width: 49px;
            height: 38px;
        }

        /* =========================================================
   MEMORY / PICK-UP
   EXACT FIGMA COORDINATES
========================================================= */

        #memory-button {
            position: absolute;

            left: 85px;
            top: 717px;

            width: 258px;
            height: 80px;

            z-index: 60;

            border: 1px solid rgba(255, 255, 255, .10);

            background: rgba(0, 0, 0, .58);

            color: rgba(220, 220, 220, .52);

            font-family: "Courier New", monospace;
            font-size: 8px;
            letter-spacing: .14em;

            cursor: pointer;

            box-shadow: inset 0 0 18px rgba(0, 0, 0, .75);

            transition:
                color .2s,
                background .2s;
        }

        #memory-button:hover,
        #memory-button:focus-visible {
            background: rgba(0, 0, 0, .72);
            color: rgba(255, 255, 255, .82);
        }

        #memory-button:active {
            transform: scale(.98);
        }

        /* =========================================================
   ARCHIVE INSIDE CRT
========================================================= */

        .archive {
            width: 100%;
            height: 100%;
            padding: 12px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .archive::-webkit-scrollbar {
            display: none;
        }

        .archive-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;
            padding-bottom: 5px;

            border-bottom: 1px solid rgba(255, 255, 255, .10);
        }

        .archive-title {
            font-size: 9px;
            letter-spacing: .15em;
        }

        .archive-status {
            font-size: 7px;
            opacity: .40;
        }

        .archive-item {
            display: block;
            width: 100%;

            margin-bottom: 5px;
            padding: 7px;

            border: 1px solid rgba(255, 255, 255, .08);

            background: rgba(0, 0, 0, .30);

            color: rgba(220, 220, 220, .72);

            font-family: "Courier New", monospace;
            font-size: 8px;

            text-align: left;

            cursor: pointer;
        }

        .archive-item:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }

        .archive-item small {
            display: block;
            margin-top: 3px;
            opacity: .40;
            font-size: 6px;
        }

        /* =========================================================
   ARTIFACT / MEMORY VIEW
========================================================= */

        #artifact {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: none;

            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, .90);
        }

        #artifact.open {
            display: flex;
        }

        .artifact-window {
            position: relative;

            width: min(90vw, 720px);
            max-height: 88vh;

            overflow: auto;

            padding: 22px;

            background: #090909;
            color: #ddd;

            border: 1px solid rgba(255, 255, 255, .14);

            box-shadow:
                0 0 40px rgba(0, 0, 0, .9),
                inset 0 0 30px rgba(255, 255, 255, .025);
        }

        #artifact-close {
            position: sticky;
            top: 0;
            float: right;

            width: 30px;
            height: 30px;

            border: 1px solid rgba(255, 255, 255, .15);

            background: #111;
            color: #aaa;

            cursor: pointer;
        }

        #artifact-content {
            clear: both;
            padding-top: 12px;
        }

        .artifact-title {
            margin: 0 0 8px;
            font-size: 18px;
            letter-spacing: .12em;
        }

        .artifact-meta {
            margin-bottom: 18px;
            color: #777;
            font-size: 11px;
        }

        .artifact-text {
            white-space: pre-wrap;
            line-height: 1.65;
            font-size: 13px;
        }

        .artifact-media {
            display: block;
            max-width: 100%;
            max-height: 65vh;
            margin: 0 auto;
        }

        .artifact-audio {
            width: 100%;
        }

        .artifact-video {
            display: block;
            width: 100%;
            max-height: 70vh;
            background: #000;
        }

        /* =========================================================
   SMALLER PHONES
   The canvas itself is still 429×932.
   Only the scale changes.
========================================================= */

        @media (max-height: 700px) {
            .artifact-window {
                max-height: 84vh;
            }
        }

        @media (max-width: 380px) {
            #screen {
                /* no geometry change — viewport scaling handles it */
            }
        }

        .archive-external-link {
            color: #ddd;
            text-decoration: underline;
            letter-spacing: .08em;
            font-size: 11px
        }

        .voicebank-artifact {
            max-width: 620px;
            margin: auto
        }

        .voicebank-artifact .artifact-media {
            max-height: 42vh
        }

        .voicebank-subtitle,
        .voicebank-context {
            color: #999;
            font-size: 11px;
            letter-spacing: .08em
        }
    </style>
    <link rel="stylesheet" href="css/archive-system.css">
</head>

<body>

    <div id="viewport">

        <!-- Physical machine -->
        <div id="jihanki">
            <img id="machine-image" src="assets/jihanki.png" alt="JIHANKI memory vending machine" draggable="false">
        </div>

        <!-- CRT -->
        <div id="screen">
            <div id="screen-content">
                <div class="boot">
                    <div class="boot-japanese">自販機</div>
                    <div class="boot-title">JIHANKI</div>
                    <div class="boot-subtitle">MEMORY ARCHIVE</div>
                    <div class="boot-loading">SELECT A MEMORY</div>
                </div>
            </div>
            <div id="credit-display" class="credit-display" role="status" aria-live="polite" aria-atomic="true">CREDITS
                / 0</div>
        </div>

        <!-- Eight archive slots -->
        <div id="products">

            <button class="product" id="video" data-category="video">
                <span class="product-label">VIDEO</span>
            </button>

            <button class="product" id="photo" data-category="photo">
                <span class="product-label">PHOTO</span>
            </button>

            <button class="product" id="note" data-category="utau">
                <span class="product-label">UTAU</span>
            </button>

            <button class="product" id="yokai" data-category="text">
                <span class="product-label">DOCS</span>
            </button>

            <button class="product" id="music" data-category="music">
                <span class="product-label">MUSIC</span>
            </button>

            <button class="product" id="sound" data-category="sound">
                <span class="product-label">SOUND</span>
            </button>

            <button class="product" id="text" data-category="text-index">
                <span class="product-label">NOTES</span>
            </button>

            <button class="product" id="other" data-category="performance">
                <span class="product-label">PERFORMANCE</span>
            </button>

        </div>

        <!-- Coin / Home -->
        <div id="controls">

            <button id="coin-button" class="machine-control" type="button" aria-label="Insert coin">
                COIN
            </button>

            <button id="home-button" class="machine-control" type="button" aria-label="Home">
                HOME
            </button>

        </div>

        <!-- Pick-up slot -->
        <button id="memory-button" type="button">
            MEMORY / PICK UP
        </button>

    </div>

    <div id="machine-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Large artifact viewer -->
    <div id="artifact" role="dialog" aria-modal="true" aria-label="JIHANKI archive memory" aria-hidden="true"
        tabindex="-1">
        <div class="artifact-window">

            <button id="artifact-close" type="button" aria-label="Close">
                ×
            </button>

            <div id="artifact-content"></div>

        </div>
    </div>

    <script src="data/archive.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/events.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/relationships.js"></script>
    <script src="js/geography.js"></script>
    <script src="js/rotation.js"></script>
    <script src="js/temporal.js"></script>
    <script src="js/receipts.js"></script>
    <script src="js/collection.js"></script>
    <script src="js/museum.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/maintenance.js"></script>
    <script src="js/anomalies.js"></script>
    <script src="js/video.js"></script>
    <script src="js/personality.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/map.js"></script>
    <script src="js/soundscape.js"></script>
    <script src="js/machine.js"></script>
    <script>
        if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
            window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {
                const status = document.getElementById("machine-announcer");
                if (status) status.textContent = "OFFLINE CACHE UNAVAILABLE";
            }));
        }
    </script>

</body>

</html>
